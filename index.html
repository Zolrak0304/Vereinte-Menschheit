<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.9.7</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:10px}
.box{border:3px solid #0f0;padding:12px;margin:10px 0;background:#000}
input{width:100%;padding:18px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:18px;margin:6px 0;background:#0a0;color:#fff;font-weight:bold;font-size:19px;border:none}
#status{font-size:20px;text-align:center;padding:12px;border:3px solid #0ff}
.team{border:2px solid #0f0;padding:10px;margin:6px 0;cursor:pointer}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.7 - BLEIBT ANGEMELDET</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort erstellen">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button onclick="doLogin()" style="background:#00ff00;color:#000">ANMELDEN / REGISTRIEREN</button>
<button onclick="doZolrak()" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button onclick="doLogout()" style="background:#333">ABMELDEN + ALLES LÖSCHEN</button>
</div>

<div class="box"><h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.7</h1><p id="myInfo" style="text-align:center;font-size:12px"></p></div>

<div class="box"><h2 style="text-align:center">TEAMS (1-7 pro Team, max 3 pro Person)</h2><input id="teamName" placeholder="Team Name"><button onclick="doCreateTeam()" style="background:#0a0">Team gründen</button><div id="teamListe"></div></div>

<div id="teamDetail"></div>

<script>
var users = {}; var teams = []; var meinName = "";
try{ users = JSON.parse(localStorage.getItem('NEXUS_V7_USERS')||'{}'); }catch(e){ users={}; }
try{ teams = JSON.parse(localStorage.getItem('NEXUS_V7_TEAMS')||'[{"name":"Nahrung","members":["Zolrak"],"msgs":["Zolrak: Jahr 0 - Nahrung sichern"]}]'); }catch(e){ teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}]; }
try{ meinName = localStorage.getItem('NEXUS_V7_ME')||''; }catch(e){}

function save(){ localStorage.setItem('NEXUS_V7_USERS', JSON.stringify(users)); localStorage.setItem('NEXUS_V7_TEAMS', JSON.stringify(teams)); localStorage.setItem('NEXUS_V7_ME', meinName); }
function countTeams(){ var c=0; for(var i=0;i<teams.length;i++){ if(teams[i].members.indexOf(meinName)!==-1) c++; } return c; }

function doLogin(){
  var n=document.getElementById('name').value.trim(); var p1=document.getElementById('pass1').value.trim(); var p2=document.getElementById('pass2').value.trim();
  if(n.length<2){ alert("Name zu kurz"); return; } if(p1.length<3){ alert("Passwort mind 3 Zeichen"); return; }
  if(users[n]){ if(users[n]!==p1){ alert("FALSCHES PASSWORT"); return; } meinName=n; }
  else{ if(p1!==p2){ alert("Passwörter nicht gleich"); return; } users[n]=p1; meinName=n; alert("ERSTELLT! "+n); }
  save(); updateStatus(); zeigeTeams();
}
function doZolrak(){
  // FIX: Direkt als Zolrak geht auch wenn Passwort-Feld leer ist
  if(!users['Zolrak']){ 
    // Wenn noch gar kein Zolrak existiert, erstelle ihn mit dem Passwort aus Feld
    var p = document.getElementById('pass1').value.trim();
    if(p.length<3){ alert("Bitte erst als Zolrak registrieren - Passwort eingeben oben!"); return; }
    users['Zolrak']=p; 
  }
  meinName='Zolrak'; save(); updateStatus(); zeigeTeams(); alert("DIREKT ALS ZOLRAK - Eingeloggt!");
}
function doLogout(){ if(!confirm("Wirklich alles löschen?")) return; localStorage.removeItem('NEXUS_V7_USERS'); localStorage.removeItem('NEXUS_V7_TEAMS'); localStorage.removeItem('NEXUS_V7_ME'); users={}; teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}]; meinName=""; updateStatus(); zeigeTeams(); }

function updateStatus(){
  var st=document.getElementById('status');
  if(meinName){ st.innerHTML="✓ ANGEMELDET: "+meinName+" | Teams "+countTeams()+"/3"; st.style.color="#0f0"; st.style.background="#020"; document.getElementById('name').value=meinName; }
  else{ st.innerHTML="NICHT ANGEMELDET"; st.style.color="#f88"; st.style.background="#200"; }
}
function doCreateTeam(){
  if(!meinName){ alert("Erst anmelden"); return; } var t=document.getElementById('teamName').value.trim(); if(t.length<3){ alert("Mind 3 Zeichen"); return; }
  if(countTeams()>=3){ alert("Max 3 Teams!"); return; } for(var i=0;i<teams.length;i++){ if(teams[i].name.toLowerCase()===t.toLowerCase()){ alert("Team existiert"); return; } }
  teams.push({name:t, members:[meinName], msgs:[meinName+": Team "+t+" gegründet"]}); document.getElementById('teamName').value=""; save(); zeigeTeams();
}
function zeigeTeams(){ var div=document.getElementById('teamListe'); var html=""; for(var i=0;i<teams.length;i++){ var t=teams[i]; var isM=t.members.indexOf(meinName)!==-1; html+='<div class="team" onclick="oeffneTeam('+i+')"><b>'+t.name+'</b> ('+t.members.length+'/7) '+(isM?'✅':'')+'<br><small>'+t.members.join(', ')+'</small></div>'; } div.innerHTML=html; document.getElementById('myInfo').innerHTML='Du: '+(meinName||'nicht angemeldet')+' | Teams: '+countTeams()+'/3 | Jeder darf lesen, nur Mitglieder schreiben'; }
function oeffneTeam(idx){ var t=teams[idx]; var isM=t.members.indexOf(meinName)!==-1; var html='<div style="border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;position:fixed;top:10px;left:10px;right:10px;bottom:10px;overflow-y:auto;z-index:99"><h2>TEAM: '+t.name+'</h2><p>'+t.members.length+'/7: '+t.members.join(', ')+'</p>'; for(var j=0;j<t.msgs.length;j++){ html+='<div style="border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000;color:#0f0">'+t.msgs[j]+'</div>'; } if(meinName && isM){ html+='<input id="chatInput" placeholder="Nachricht..."><button onclick="sendeChat('+idx+')">Senden als '+meinName+'</button>'; } else if(meinName && !isM){ if(t.members.length>=7){ html+='<p>Voll!</p>'; }else if(countTeams()>=3){ html+='<p>Max 3 Teams!</p>'; }else{ html+='<button onclick="beitreten('+idx+')" style="background:#0ff;color:#000">Beitreten als '+meinName+'</button>'; } } html+='<button onclick="document.getElementById(\'teamDetail\').innerHTML=\'\'" style="background:#333;margin-top:10px">Schließen</button></div>'; document.getElementById('teamDetail').innerHTML=html; }
function beitreten(idx){ if(countTeams()>=3){ alert("Max 3 Teams"); return; } var t=teams[idx]; if(t.members.length>=7){ alert("Voll"); return; } t.members.push(meinName); t.msgs.push(meinName+" beigetreten"); save(); zeigeTeams(); oeffneTeam(idx); }
function sendeChat(idx){ var el=document.getElementById('chatInput'); var txt=el.value.trim(); if(!txt) return; teams[idx].msgs.push(meinName+": "+txt); save(); oeffneTeam(idx); zeigeTeams(); }

updateStatus(); zeigeTeams();
</script>
</body>
</html>
