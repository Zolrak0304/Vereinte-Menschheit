<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.9.3 - FIX</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:12px}
.box{border:3px solid #0f0;padding:12px;margin:12px 0;background:#000}
input{width:100%;padding:16px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:16px;margin:6px 0;background:#0a0;color:#fff;font-weight:bold;font-size:18px;border:0}
#status{font-size:20px;text-align:center;padding:12px;border:3px solid #0ff}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.3 - FIX</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET - Name + Passwort nötig</div>
<input id="name" value="Zolrak" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort erstellen">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button id="btnLogin" style="background:#0f0;color:#000">ANMELDEN / REGISTRIEREN</button>
<button id="btnDirekt" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button id="btnLogout" style="background:#333">ABMELDEN + LÖSCHEN</button>
</div>

<div class="box">
<h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.3</h1>
<p style="text-align:center;font-size:11px">SICHER: Jeder Name mit Passwort</p>
<div id="teamListe"></div>
</div>

<script>
// SICHERER LOAD - wenn alter Speicher kaputt ist, löschen
let users = {};
try{ users = JSON.parse(localStorage.getItem('nexus_users_v3')||'{}'); }catch(e){ localStorage.removeItem('nexus_users_v3'); users = {}; }
let meinName = localStorage.getItem('nexus_meinName_v3')||'';

function save(){ localStorage.setItem('nexus_users_v3', JSON.stringify(users)); if(meinName) localStorage.setItem('nexus_meinName_v3', meinName); }

function registerLogin(){
  console.log("Klick!");
  let n = document.getElementById('name').value.trim();
  let p1 = document.getElementById('pass1').value.trim();
  let p2 = document.getElementById('pass2').value.trim();
  
  if(n.length<2){ alert('Name zu kurz'); return; }
  if(p1.length<3){ alert('Passwort mind. 3 Zeichen!'); return; }

  if(users[n]){
    if(users[n] !== p1){ alert('FALSCHES PASSWORT für '+n+'!'); return; }
    meinName = n;
    document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: '+n;
    document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020';
    save(); alert('Login OK als '+n);
  } else {
    if(p1 !== p2){ alert('Passwörter nicht gleich! Bitte gleich eingeben!'); return; }
    users[n] = p1;
    meinName = n;
    document.getElementById('status').innerHTML='✓ NEU REGISTRIERT: '+n;
    document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020';
    save(); alert('ERSTELLT! '+n+' ist jetzt geschützt!');
  }
}

function direktZolrak(){
  if(!users['Zolrak']){ alert('Zolrak noch nicht registriert! Erst oben registrieren!'); return; }
  meinName = 'Zolrak';
  document.getElementById('status').innerHTML='✓ DIREKT ALS ZOLRAK';
  document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020';
  save();
}

function logout(){
  localStorage.removeItem('nexus_meinName_v3');
  meinName=''; document.getElementById('status').innerHTML='NICHT ANGEMELDET'; 
  document.getElementById('status').style.color='#f88'; document.getElementById('status').style.background='#200';
}

// BUTTONS SICHER VERBINDEN
document.getElementById('btnLogin').addEventListener('click', registerLogin);
document.getElementById('btnDirekt').addEventListener('click', direktZolrak);
document.getElementById('btnLogout').addEventListener('click', logout);

if(meinName){
  document.getElementById('name').value=meinName;
  document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: '+meinName;
  document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020';
}
console.log("V1.9.3 FIX geladen");
</script>
</body>
</html>
