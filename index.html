<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEST V10</title>
<style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}input,button{width:100%;padding:20px;margin:10px 0;font-size:20px}button{background:#0f0;color:#000;font-weight:bold}</style>
</head>
<body>
<h1>TEST V10 - BUTTON TEST</h1>
<input id="name" placeholder="Name">
<input id="pass" type="password" placeholder="Passwort">
<button type="button" onclick="alert('BUTTON GEHT!'); var n=document.getElementById('name').value; alert('Name: '+n);">1. TEST OB BUTTON GEHT</button>
<button type="button" onclick="doLogin()">2. ANMELDEN TEST</button>
<div id="out" style="border:2px solid #0f0;padding:10px;margin-top:20px">Status: bereit</div>
<script>
function doLogin(){
  alert("doLogin wird aufgerufen!");
  var n=document.getElementById('name').value.trim();
  var p=document.getElementById('pass').value.trim();
  document.getElementById('out').innerHTML="Angemeldet: "+n+" / "+p;
  localStorage.setItem('TEST_USER', n);
  alert("Gespeichert: "+n);
}
alert("JS geladen - V10");
</script>
</body>
</html>
