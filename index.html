<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.10</title>
<style>body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:10px}.box{border:3px solid #0f0;padding:12px;margin:10px 0;background:#000}input{width:100%;padding:18px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}button{width:100%;padding:18px;margin:6px 0;font-weight:bold;font-size:18px;border:none}button:active{opacity:0.7}#status{font-size:19px;text-align:center;padding:12px;border:3px solid #0ff}.team{border:2px solid #0f0;padding:10px;margin:6px 0}</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.10</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name z.B. Zolrak">
<input id="pass1" type="password" placeholder="Passwort">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button type="button" onclick="doLogin()" style="background:#0f0;color:#000">ANMELDEN / REGISTRIEREN</button>
<button type="button" onclick="doZolrak()" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button type="button" onclick="doLogout()" style="background:#333;color:#fff">ABMELDEN</button>
<button type="button" onclick="doDelete()" style="background:#800;color:#fff;border:2px solid red">⚠️ ALLES LÖSCHEN - Account + Teams</button>
</div>

<div class="box"><h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.10</h1><p id="myInfo" style="text-align:center;font-size:12px"></p></div>
<div class="box"><h2 style="text-align:center">TEAMS (1-7 pro Team, max 3 pro Person)</h2><input id="teamName" placeholder="Team Name"><button type="button" onclick="doCreateTeam()" style="background:#0a0;color:#fff">Team gründen</button><div id="teamListe"></div></div>
<div id="teamDetail"></div>

<script>
// NUR NEUE KEYS - kein alter Schrott
var users = {}; var teams = []; var meinName = "";
try{ var u=localStorage.getItem('N10_USERS'); if(u) users=JSON.parse(u); }catch(e){}
try{ var t=localStorage.getItem('N10_TEAMS'); if(t) teams=JSON.parse(t); }catch(e){}
if(teams.length===0) teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0 - Nahrung sichern"]}];

function save(){ localStorage.setItem('N10_USERS', JSON.stringify(users)); localStorage.setItem('N10_TEAMS', JSON.stringify(teams)); }
function countTeams(){ var c=0; for(var i=0;i<teams.length;i++){ if(teams[i].members.indexOf(meinName)!==-1) c++; } return c; }
function updateStatus(){ var s=document.getElementById('status'); if(meinName){ s.innerHTML="✓ ANGEMELDET: "+meinName+" | Teams "+countTeams()+"/3"; s.style.color="#0f0"; s.style.background="#020"; document.getElementById('name').value=meinName; }else{ s.innerHTML="NICHT ANGEMELDET - Bitte anmelden"; s.style.color="#f88"; s.style.background="#200"; } }

function doLogin(){
  var n=document.getElementById('name').value.trim();
  var p1=document.getElementById('pass1').value.trim();
  var p2=document.getElementById('pass2').value.trim();
  if(n.length<2){ alert("Name zu kurz"); return; }
  if(p1.length<3){ alert("Passwort mind 3 Zeichen"); return; }
  if(users[n]){
    if(users[n]!==p1){ alert("FALSCHES PASSWORT für "+n); return; }
    meinName=n; updateStatus(); zeigeTeams(); alert("LOGIN OK als "+n);
  }else{
    if(p1!==p2){ alert("Passwörter nicht gleich"); return; }
    users[n]=p1; meinName=n; save(); updateStatus(); zeigeTeams(); alert("ERSTELLT! "+n);
  }
}
function doZolrak(){
  var p=document.getElementById('pass1').value.trim();
  if(!users["Zolrak"]){ alert("Zolrak gibt es noch nicht - erst oben als Zolrak registrieren"); return; }
  if(users["Zolrak"]!==p){ alert("Falsches Passwort für Zolrak"); return; }
  meinName="Zolrak"; updateStatus(); zeigeTeams(); alert("DIREKT ALS ZOLRAK OK");
}
function doLogout(){ meinName=""; updateStatus(); zeigeTeams(); alert("Abgemeldet - Teams bleiben"); }
function doDelete(){
  if(!meinName){ alert("Erst anmelden"); return; }
  if(!confirm("ALLES LÖSCHEN?\nAccount "+meinName+" löschen + aus allen Teams entfernen?")) return;
  for(var i=0;i<teams.length;i++){ var idx=teams[i].members.indexOf(meinName); if(idx!==-1){ teams[i].members.splice(idx,1); teams[i].msgs.push(meinName+" hat alles gelöscht"); } }
  teams=teams.filter(function(t){ return t.members.length>0; });
  if(teams.length===0) teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}];
  delete users[meinName]; meinName=""; save(); updateStatus(); zeigeTeams(); alert("Alles gelöscht!");
}
function doCreateTeam(){
  if(!meinName){ alert("Erst anmelden"); return; }
  var tn=document.getElementById('teamName').value.trim(); if(tn.length<3){ alert("Mind 3 Zeichen"); return; }
  if(countTeams()>=3){ alert("Max 3 Teams erreicht!"); return; }
  for(var i=0;i<teams.length;i++){ if(teams[i].name.toLowerCase()===tn.toLowerCase()){ alert("Team existiert"); return; } }
  teams.push({name:tn, members:[meinName], msgs:[meinName+": Team "+tn+" gegründet"]}); document.getElementById('teamName').value=""; save(); zeigeTeams();
}
function zeigeTeams(){ var d=document.getElementById('teamListe'); var h=""; for(var i=0;i<teams.length;i++){ var t=teams[i]; var isM=meinName && t.members.indexOf(meinName)!==-1; h+='<div class="team" onclick="oeffneTeam('+i+')"><b>'+t.name+'</b> ('+t.members.length+'/7) '+(isM?'✅':'')+'<br><small>'+t.members.join(', ')+'</small></div>'; } d.innerHTML=h; document.getElementById('myInfo').innerHTML='Du: '+(meinName||'nicht angemeldet')+' | Teams: '+(meinName?countTeams()+'/3':'0/3')+' | Jeder darf lesen, nur Mitglieder schreiben'; }
function oeffneTeam(i){ var t=teams[i]; var isM=meinName && t.members.indexOf(meinName)!==-1; var h='<div style="border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;position:fixed;top:10px;left:10px;right:10px;bottom:10px;overflow:auto;z-index:99"><h2>TEAM: '+t.name+'</h2><p>'+t.members.length+'/7: '+t.members.join(', ')+'</p>'; for(var j=0;j<t.msgs.length;j++){ h+='<div style="border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000;color:#0f0">'+t.msgs[j]+'</div>'; } if(meinName && isM){ h+='<input id="chatInput" placeholder="Nachricht..." style="width:100%;padding:12px"><button type="button" onclick="sendeChat('+i+')" style="background:#0f0;color:#000;padding:12px;width:100%">Senden als '+meinName+'</button>'; }else if(meinName && !isM){ if(t.members.length>=7){ h+='<p style="color:red">Voll 7/7</p>'; }else if(countTeams()>=3){ h+='<p style="color:red">Du hast schon 3 Teams</p>'; }else{ h+='<button type="button" onclick="beitreten('+i+')" style="background:#0ff;color:#000;padding:12px;width:100%">Beitreten als '+meinName+'</button>'; } }else{ h+='<p>Erst anmelden zum Beitreten</p>'; } h+='<button type="button" onclick="document.getElementById(\'teamDetail\').innerHTML=\'\'" style="background:#333;color:#fff;margin-top:10px;padding:10px;width:100%">Schließen</button></div>'; document.getElementById('teamDetail').innerHTML=h; }
function beitreten(i){ if(countTeams()>=3){ alert("Max 3 Teams"); return; } if(teams[i].members.length>=7){ alert("Voll"); return; } teams[i].members.push(meinName); teams[i].msgs.push(meinName+" beigetreten"); save(); zeigeTeams(); oeffneTeam(i); }
function sendeChat(i){ var el=document.getElementById('chatInput'); var txt=el.value.trim(); if(!txt) return; teams[i].msgs.push(meinName+": "+txt); save(); oeffneTeam(i); zeigeTeams(); }

updateStatus(); zeigeTeams();
</script>
</body>
</html>
