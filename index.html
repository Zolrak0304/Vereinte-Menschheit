<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.8.2 DIREKT</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:12px}
.box{border:3px solid #0f0;padding:16px;margin:12px 0;background:#000}
input{width:100%;padding:20px;margin:12px 0;background:#111;border:3px solid #0f0;color:#0f0;font-size:22px}
button{width:100%;padding:20px;margin:10px 0;background:#0a0;color:#fff;font-weight:bold;font-size:22px;border:0}
#status{font-size:26px;text-align:center;padding:12px;border:3px solid #0ff}
.team{border:2px dashed #0f0;padding:12px;margin:8px 0}
.detail{border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;margin:12px 0}
.msg{border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center;margin:0">🔐 ANMELDUNG V1.8.2</h2>
<div id="status" style="color:#f00;background:#200">NICHT ANGEMELDET</div>
<input id="name" type="text" value="Zolrak" placeholder="name">
<button onclick="window.meinName=document.getElementById('name').value.trim()||'Zolrak'; document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: '+window.meinName; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; alert('Angemeldet: '+window.meinName);">ANMELDEN</button>
<button style="background:#0ff;color:#000" onclick="window.meinName='Zolrak'; document.getElementById('name').value='Zolrak'; document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: Zolrak'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; alert('Als Zolrak angemeldet');">DIREKT ALS ZOLRAK</button>
</div>

<div class="box">
<h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT<br>V1.8.2</h1>
<p style="text-align:center;font-size:11px">Prio 1 Anmeldung muss gehen</p>
</div>

<div class="box">
<h2 style="text-align:center">TEAMS (1-7)</h2>
<input id="teamName" placeholder="Team Name">
<button onclick="if(!window.meinName){window.meinName='Zolrak'; document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: Zolrak'; document.getElementById('status').style.color='#0f0';} var t=document.getElementById('teamName').value.trim(); if(t.length<3){alert('Mind 3 Zeichen');} else { var div=document.getElementById('teamListe'); var el=document.createElement('div'); el.className='team'; el.innerHTML='<b>'+t+'</b> Mitglieder: '+window.meinName; el.onclick=function(){document.getElementById('teamDetail').innerHTML='<div class=detail><h3>'+t+'</h3><p>'+window.meinName+'</p><button onclick=document.getElementById(&quot;teamDetail&quot;).innerHTML=&quot;&quot;>Schließen</button></div>'}; div.appendChild(el); document.getElementById('teamName').value=''; alert('Team gegründet: '+t);}">Team gründen</button>
<div id="teamListe"></div>
<div id="teamDetail"></div>
</div>

<script>window.meinName=""; console.log("V1.8.2 DIREKT geladen");</script>
</body>
</html>
