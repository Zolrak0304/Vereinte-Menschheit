<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:10px}

button{width:100%;padding:18px;margin:6px 0;font-weight:bold;font-size:18px;border:none}

.team{border:2px solid #0f0;padding:10px;margin:6px 0}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.9 - FIX</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button onclick="doLogin()" style="background:#0f0;color:#000">ANMELDEN / REGISTRIEREN</button>
<button onclick="doZolrak()" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button onclick="doLogout()" style="background:#333;color:#fff">ABMELDEN</button>
<button onclick="doDelete()" style="background:#800;color:#fff;border:2px solid red">⚠️ ALLES LÖSCHEN</button>
</div>

<div class="box"><h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.9</h1><p id="myInfo" style="text-align:center;font-size:12px"></p></div>
<div class="box"><h2 style="text-align:center">TEAMS (1-7 pro Team, max 3 pro Person)</h2><input id="teamName" placeholder="Team Name"><button onclick="doCreateTeam()" style="background:#0a0;color:#fff">Team gründen</button><div id="teamListe"></div></div>
<div id="teamDetail"></div>

<script>
var users = {}; var teams = []; var meinName = "";
try{
  var u = localStorage.getItem('N9_USERS'); if(u) users = JSON.parse(u);
}catch(e){ users={}; }
try{
  var t = localStorage.getItem('N9_TEAMS'); if(t) teams = JSON.parse(t); else teams = [{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}];
}catch(e){ teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}]; }

function save(){ localStorage.setItem('N9_USERS', JSON.stringify(users)); localStorage.setItem('N9_TEAMS', JSON.stringify(teams)); }
function countTeams(){ var c=0; for(var i=0;i<teams.length;i++){ if(teams[i].members && teams[i].members.indexOf(meinName)!==-1) c++; } return c; }
function updateStatus(){ var s=document.getElementById('status'); if(meinName){ s.innerHTML="✓ ANGEMELDET: "+meinName+" | Teams "+countTeams()+"/3"; s.style.color="#0f0"; s.style.background="#020"; }else{ s.innerHTML="NICHT ANGEMELDET - Bitte anmelden"; s.style.color="#f88"; s.style.background="#200"; } }

function doLogin(){
  try{
    var n=document.getElementById('name').value.trim();
    var p1=document.getElementById('pass1').value.trim();
    var p2=document.getElementById('pass2').value.trim();
    if(n.length<2){ alert("Name zu kurz"); return; }
    if(p1.length<3){ alert("Passwort mind 3 Zeichen"); return; }
    if(users[n]){
      if(users[n]!==p1){ alert("FALSCHES PASSWORT für "+n); return; }
      meinName=n; save(); updateStatus(); zeigeTeams(); alert("LOGIN OK als "+n);
    }else{
      if(p1!==p2){ alert("Passwörter nicht gleich"); return; }
      users[n]=p1; meinName=n; save(); updateStatus(); zeigeTeams(); alert("ERSTELLT! "+n);
    }
  }catch(e){ alert("Fehler: "+e.message); }
}
function doZolrak(){
  try{
    var p=document.getElementById('pass1').value.trim();
    if(!users["Zolrak"]){ alert("Zolrak existiert nicht - erst als Zolrak registrieren"); return; }
    if(users["Zolrak"]!==p){ alert("Falsches Passwort für Zolrak"); return; }
    meinName="Zolrak"; updateStatus(); zeigeTeams(); alert("DIREKT ALS ZOLRAK OK");
  }catch(e){ alert(e.message); }
}
function doLogout(){ meinName=""; updateStatus(); zeigeTeams(); alert("Abgemeldet"); }
function doDelete(){
  if(!meinName){ alert("Erst anmelden"); return; }
  if(!confirm("Wirklich ALLES LÖSCHEN? Account "+meinName+" + aus allen Teams?")) return;
  for(var i=0;i<teams.length;i++){ var idx=teams[i].members.indexOf(meinName); if(idx!==-1){ teams[i].members.splice(idx,1); teams[i].msgs.push(meinName+" hat ALLES gelöscht"); } }
  teams = teams.filter(function(t){ return t.members.length>0; });
  if(teams.length===0) teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}];
  delete users[meinName]; meinName=""; save(); updateStatus(); zeigeTeams(); alert("Alles gelöscht");
}

  if(!meinName){ alert("Erst anmelden"); return; }
  var tn=document.getElementById('teamName').value.trim(); if(tn.length<3){ alert("Mind 3 Zeichen"); return; }
  if(countTeams()>=3){ alert("Max 3 Teams!"); return; }
