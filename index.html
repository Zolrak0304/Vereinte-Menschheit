<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.9.6</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:10px}
.box{border:3px solid #0f0;padding:12px;margin:10px 0;background:#000}
input{width:100%;padding:18px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:18px;margin:6px 0;background:#0a0;color:#fff;font-weight:bold;font-size:19px;border:none}
#status{font-size:20px;text-align:center;padding:12px;border:3px solid #0ff;color:#f88;background:#200}
.team{border:2px solid #0f0;padding:10px;margin:6px 0}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.6</h2>
<div id="status">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort erstellen">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button onclick="window.doLogin()" style="background:#00ff00;color:#000">ANMELDEN / REGISTRIEREN</button>
<button onclick="window.doZolrak()" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button onclick="window.doLogout()" style="background:#333">ABMELDEN + ALLES LÖSCHEN</button>
</div>

<div class="box"><h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.6</h1><p id="myInfo" style="text-align:center;font-size:12px"></p></div>

<div class="box"><h2 style="text-align:center">TEAMS (1-7 pro Team, max 3 pro Person)</h2><input id="teamName" placeholder="Team Name"><button onclick="window.doCreateTeam()" style="background:#0a0">Team gründen</button><div id="teamListe"></div></div>

<div id="teamDetail"></div>

<script>
alert("V1.9.6 lädt... wenn du das siehst geht JS");

// ALLES LÖSCHEN WAS KAPUTT SEIN KÖNNTE
try{
  localStorage.clear();
}catch(e){}

window.users = {};
window.teams = [{name:"Nahrung", members:["Zolrak"], msgs:["Zolrak: Jahr 0"]}];
window.meinName = "";

// VERSUCHE ZU LADEN ABER OHNE CRASH
try{
  var u = localStorage.getItem('NEXUS_V6_USERS');
  if(u) window.users = JSON.parse(u);
  var t = localStorage.getItem('NEXUS_V6_TEAMS');
  if(t) window.teams = JSON.parse(t);
  var m = localStorage.getItem('NEXUS_V6_ME');
  if(m) window.meinName = m;
}catch(e){
  // Wenn kaputt, egal, nutze leere
}

window.save = function(){
  localStorage.setItem('NEXUS_V6_USERS', JSON.stringify(window.users));
  localStorage.setItem('NEXUS_V6_TEAMS', JSON.stringify(window.teams));
  if(window.meinName) localStorage.setItem('NEXUS_V6_ME', window.meinName);
}

window.countTeams = function(){
  var c=0; for(var i=0;i<window.teams.length;i++){ if(window.teams[i].members.indexOf(window.meinName)!==-1) c++; } return c;
}

window.doLogin = function(){
  var n = document.getElementById('name').value.trim();
  var p1 = document.getElementById('pass1').value.trim();
  var p2 = document.getElementById('pass2').value.trim();
  
  if(n.length<2){ alert("Name zu kurz"); return; }
  if(p1.length<3){ alert("Passwort mind 3 Zeichen"); return; }
  
  if(window.users[n]){
    if(window.users[n] !== p1){ alert("FALSCHES PASSWORT für "+n); return; }
    window.meinName = n;
    alert("LOGIN OK als "+n);
  }else{
    if(p1 !== p2){ alert("Passwörter nicht gleich!"); return; }
    window.users[n] = p1;
    window.meinName = n;
    alert("ERSTELLT! "+n+" ist jetzt geschützt");
  }
  window.save();
  document.getElementById('status').innerHTML = "✓ ANGEMELDET: "+window.meinName+" | Teams "+window.countTeams()+"/3";
  document.getElementById('status').style.color="#0f0";
  document.getElementById('status').style.background="#020";
  window.zeigeTeams();
}

window.doZolrak = function(){
  if(!window.users['Zolrak']){ alert("Zolrak noch nicht registriert! Erst oben als Zolrak registrieren!"); return; }
  window.meinName="Zolrak";
  window.save();
  document.getElementById('status').innerHTML="✓ DIREKT ALS ZOLRAK";
  document.getElementById('status').style.color="#0f0"; document.getElementById('status').style.background="#020";
  window.zeigeTeams();
}

window.doLogout = function(){
  localStorage.clear();
  window.users={}; window.teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}]; window.meinName="";
  document.getElementById('status').innerHTML="NICHT ANGEMELDET - ALLES GELÖSCHT";
  document.getElementById('status').style.color="#f88"; document.getElementById('status').style.background="#200";
  window.zeigeTeams();
  alert("Alles gelöscht - jetzt neu anmelden");
}

window.doCreateTeam = function(){
  if(!window.meinName){ alert("Erst anmelden"); return; }
  var t=document.getElementById('teamName').value.trim();
  if(t.length<3){ alert("Mind 3 Zeichen"); return; }
  if(window.countTeams()>=3){ alert("Du bist schon in 3 Teams! Max 3!"); return; }
  for(var i=0;i<window.teams.length;i++){ if(window.teams[i].name.toLowerCase()===t.toLowerCase()){ alert("Team existiert"); return; } }
  window.teams.push({name:t, members:[window.meinName], msgs:[window.meinName+": Team "+t+" gegründet"]});
  document.getElementById('teamName').value=""; window.save(); window.zeigeTeams();
}

window.zeigeTeams = function(){
  var div=document.getElementById('teamListe'); var html="";
  for(var i=0;i<window.teams.length;i++){ var t=window.teams[i]; var isM=t.members.indexOf(window.meinName)!==-1; html+='<div class="team" onclick="window.oeffneTeam('+i+')"><b>'+t.name+'</b> ('+t.members.length+'/7) '+(isM?'✅':'')+'<br><small>'+t.members.join(', ')+'</small></div>'; }
  div.innerHTML=html;
  document.getElementById('myInfo').innerHTML='Du: '+(window.meinName||'nicht angemeldet')+' | Teams: '+window.countTeams()+'/3 | Jeder darf lesen, nur Mitglieder schreiben';
}

window.oeffneTeam = function(idx){
  var t=window.teams[idx]; var isM=t.members.indexOf(window.meinName)!==-1;
  var html='<div style="border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;position:fixed;top:10px;left:10px;right:10px;bottom:10px;overflow-y:auto;z-index:99"><h2>TEAM: '+t.name+'</h2><p>'+t.members.length+'/7: '+t.members.join(', ')+'</p>';
  for(var j=0;j<t.msgs.length;j++){ html+='<div style="border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000;color:#0f0">'+t.msgs[j]+'</div>'; }
  if(window.meinName && isM){ html+='<input id="chatInput" placeholder="Nachricht..."><button onclick="window.sendeChat('+idx+')">Senden als '+window.meinName+'</button>'; }
  else if(window.meinName && !isM){ if(t.members.length>=7){ html+='<p>Voll!</p>'; }else if(window.countTeams()>=3){ html+='<p>Max 3 Teams erreicht!</p>'; }else{ html+='<button onclick="window.beitreten('+idx+')" style="background:#0ff;color:#000">Beitreten als '+window.meinName+'</button>'; } }
  html+='<button onclick="document.getElementById(\'teamDetail\').innerHTML=\'\'" style="background:#333;margin-top:10px">Schließen</button></div>';
  document.getElementById('teamDetail').innerHTML=html;
}

window.beitreten = function(idx){ if(window.countTeams()>=3){ alert("Max 3 Teams!"); return; } var t=window.teams[idx]; if(t.members.length>=7){ alert("Voll"); return; } t.members.push(window.meinName); t.msgs.push(window.meinName+" beigetreten"); window.save(); window.zeigeTeams(); window.oeffneTeam(idx); }
window.sendeChat = function(idx){ var el=document.getElementById('chatInput'); if(!el) return; var txt=el.value.trim(); if(!txt) return; window.teams[idx].msgs.push(window.meinName+": "+txt); window.save(); window.oeffneTeam(idx); window.zeigeTeams(); }

window.zeigeTeams();
if(window.meinName){ document.getElementById('name').value=window.meinName; document.getElementById('status').innerHTML="✓ ANGEMELDET: "+window.meinName+" | Teams "+window.countTeams()+"/3"; document.getElementById('status').style.color="#0f0"; document.getElementById('status').style.background="#020"; }
</script>
</body>
</html>
