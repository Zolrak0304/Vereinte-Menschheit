<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NEXUS V1.8 MINIMAL</title>
<style>
* { box-sizing: border-box; }
body { background: #000; color: #0f0; font-family: monospace; margin: 0; padding: 12px; padding-bottom: 150px; }
.box { border: 3px solid #0f0; padding: 18px; margin: 14px 0; background: #000; }
input, textarea { width: 100%; padding: 18px; margin: 12px 0; background: #111; border: 3px solid #0f0; color: #0f0; font-size: 20px; }
button { width: 100%; padding: 18px; margin: 10px 0; background: #0a0; color: #fff; font-weight: bold; font-size: 20px; border: 0; }
.team { border: 2px dashed #0f0; padding: 14px; margin: 10px 0; background: #050505; }
.detail { border: 3px solid #ff0; padding: 16px; margin: 16px 0; background: #1a1a00; color: #ff0; }
.msg { border-left: 4px solid #0f0; padding: 8px; margin: 8px 0; background: #000; color: #0f0; }
.small { font-size: 12px; color: #8f8; }
</style>
</head>
<body>

<div class="box" style="border-color:#0ff; background:#001122;">
<h2 style="text-align:center; margin:0;">🔐 ANMELDUNG MUSS IMMER GEHEN</h2>
<p id="status" style="text-align:center; font-size:26px; font-weight:bold; color:#f00; background:#000; padding:10px; border:2px solid #0ff;">NICHT ANGEMELDET</p>
<input id="nameInput" type="text" placeholder="Zolrak eingeben" value="Zolrak">
<button type="button" onclick="login()" style="background:#0f0; color:#000; font-size:22px;">ANMELDEN - 1 KLICK</button>
<button type="button" onclick="loginZolrak()" style="background:#0ff; color:#000;">DIREKT ALS ZOLRAK - NOTFALL</button>
</div>

<div class="box">
<h1 style="text-align:center; margin:0;">VEREINTE MENSCHHEIT<br>V1.8 MINIMAL</h1>
<p class="small" style="text-align:center;">1. Anmeldung 2. Teams erstellen 3. Teams ansehen<br><span id="stats"></span></p>
</div>

<div class="box">
<h2 style="text-align:center;">MODUL 3: TEAMS (1-7)</h2>
<input id="teamInput" type="text" placeholder="Team Name z.B. Nahrung Berlin">
<button type="button" onclick="createTeam()">Team gründen</button>
<div id="teamListe"></div>
<div id="teamDetail"></div>
</div>

<script>
// GLOBAL - MUSS IMMER GEHEN
var meinName = "";
var teams = [];
var offen = -1;

function esc(s){ return String(s||'').replace(/[<>&"]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]; }); }
function now(){ return new Date().toLocaleTimeString('de-DE'); }

function updateStatus(){
  var el = document.getElementById('status');
  if(!el) return;
  if(meinName){
    el.style.color = '#0f0';
    el.style.borderColor = '#0f0';
    el.innerHTML = '✓ ANGEMELDET ALS: ' + esc(meinName);
  } else {
    el.style.color = '#f00';
    el.innerHTML = 'NICHT ANGEMELDET';
  }
}

function login(){
  var input = document.getElementById('nameInput');
  var n = input ? input.value.trim() : "";
  if(n.length < 2) n = "Zolrak";
  meinName = n;
  updateStatus();
  // Versuche speichern, aber egal wenn es nicht geht
  try { localStorage.setItem('nexusName', n); } catch(e){}
  try { sessionStorage.setItem('nexusName', n); } catch(e){}
  alert('Angemeldet als ' + n);
  zeigeTeams();
  updateStats();
}

function loginZolrak(){
  meinName = "Zolrak";
  var input = document.getElementById('nameInput');
  if(input) input.value = "Zolrak";
  updateStatus();
  try { localStorage.setItem('nexusName', 'Zolrak'); } catch(e){}
  try { sessionStorage.setItem('nexusName', 'Zolrak'); } catch(e){}
  alert('✓ Als Zolrak angemeldet - geht jetzt!');
  zeigeTeams();
  updateStats();
}

function createTeam(){
  if(!meinName){
    alert('Erst anmelden oben!');
    loginZolrak();
    return;
  }
  var el = document.getElementById('teamInput');
  var tName = el ? el.value.trim() : "";
  if(tName.length < 3){ alert('Name zu kurz, mind 3 Zeichen'); return; }
  // Check doppelt
  for(var i=0;i<teams.length;i++){ if(teams[i].name.toLowerCase() === tName.toLowerCase()){ alert('Gibt es schon'); return; } }
  teams.push({name: tName, members: [meinName], msgs: [{a: meinName, t: 'Gegründet - ' + now(), time: now()}], erstellt: now()});
  if(el) el.value = "";
  try { localStorage.setItem('nexusTeamsV18', JSON.stringify(teams)); } catch(e){}
  alert('Team gegründet: ' + tName);
  zeigeTeams();
  updateStats();
}
