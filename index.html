<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.9.4 - TEAMS + CHAT</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:12px}
.box{border:3px solid #0f0;padding:12px;margin:12px 0;background:#000}
input,textarea{width:100%;padding:16px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:16px;margin:6px 0;background:#0a0;color:#fff;font-weight:bold;font-size:18px;border:0}
#status{font-size:19px;text-align:center;padding:12px;border:3px solid #0ff}
.team{border:2px dashed #0f0;padding:12px;margin:8px 0;cursor:pointer}
.team:hover{background:#020}
.team.voll{border-color:#f00;opacity:0.6}
.detail{border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;position:fixed;top:10px;left:10px;right:10px;bottom:10px;overflow-y:auto;z-index:99}
.msg{border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000;color:#0f0;word-break:break-word}
.msg.me{border-color:#0ff;color:#0ff}
.info{border:2px solid #0ff;padding:8px;margin:8px 0;color:#0ff;background:#001}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.4</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET</div>
<input id="name" value="Zolrak" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort erstellen">
<input id="pass2" type="password" placeholder="Passwort bestätigen (bei neu)">
<button id="btnLogin" style="background:#0f0;color:#000">ANMELDEN / REGISTRIEREN</button>
<button id="btnDirekt" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button id="btnLogout" style="background:#333">ABMELDEN</button>
</div>

<div class="box">
<h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.4</h1>
<p style="text-align:center;font-size:11px" id="myTeamsInfo">Regel: 7 pro Team, max 3 Teams pro Person, Chat nur für Mitglieder</p>
</div>

<div class="box">
<h2 style="text-align:center">TEAMS (1-7 pro Team)</h2>
<input id="teamName" placeholder="Team Name z.B. Nahrung, Energie, Wasser">
<button id="btnCreateTeam">Team gründen</button>
<div id="teamListe"></div>
</div>

<div id="teamDetail"></div>

<script>
let users = {}; let teams = [];
try{ users = JSON.parse(localStorage.getItem('nexus_users_v4')||'{}'); }catch(e){ users={}; }
try{ teams = JSON.parse(localStorage.getItem('nexus_teams_v4')||'[{"name":"Nahrung","members":["Zolrak"],"msgs":["Zolrak: Jahr 0 - Nahrung sichern für alle!"]}]'); }catch(e){ teams=[{name:"Nahrung",members:["Zolrak"],msgs:["Zolrak: Jahr 0"]}]; }
let meinName = localStorage.getItem('nexus_meinName_v4')||'';

function save(){ localStorage.setItem('nexus_users_v4', JSON.stringify(users)); localStorage.setItem('nexus_teams_v4', JSON.stringify(teams)); if(meinName) localStorage.setItem('nexus_meinName_v4', meinName); }

function countMyTeams(){ let c=0; for(let t of teams){ if(t.members.includes(meinName)) c++; } return c; }

function registerLogin(){
  let n=document.getElementById('name').value.trim();
  let p1=document.getElementById('pass1').value.trim();
  let p2=document.getElementById('pass2').value.trim();
  if(n.length<2){alert('Name zu kurz');return;}
  if(p1.length<3){alert('Passwort mind 3 Zeichen');return;}
  if(users[n]){
    if(users[n]!==p1){alert('FALSCHES PASSWORT für '+n);return;}
    meinName=n; document.getElementById('status').innerHTML='✓ ANGEMELDET ALS: '+n+' | Teams: '+countMyTeams()+'/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams();
  }else{
    if(p1!==p2){alert('Passwörter nicht gleich!');return;}
    users[n]=p1; meinName=n; document.getElementById('status').innerHTML='✓ NEU: '+n+' | Teams: 0/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams(); alert('ERSTELLT! '+n+' geschützt!');
  }
}
function direktZolrak(){ if(!users['Zolrak']){alert('Zolrak noch nicht registriert!');return;} meinName='Zolrak'; document.getElementById('status').innerHTML='✓ DIREKT ALS ZOLRAK | Teams: '+countMyTeams()+'/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams(); }
function logout(){ localStorage.removeItem('nexus_meinName_v4'); meinName=''; document.getElementById('status').innerHTML='NICHT ANGEMELDET'; document.getElementById('status').style.color='#f88'; document.getElementById('status').style.background='#200'; zeigeTeams(); }

function createTeam(){
  if(!meinName){alert('Erst anmelden!');return;}
  let t=document.getElementById('teamName').value.trim();
  if(t.length<3){alert('Mind 3 Zeichen');return;}
  for(let x of teams){ if(x.name.toLowerCase()===t.toLowerCase()){alert('Team existiert schon');return;} }
  if(countMyTeams()>=3){alert('Du bist schon in 3 Teams! Max 3!');return;}
  teams.push({name:t, members:[meinName], msgs:[meinName+': Team '+t+' gegründet - Jahr 0 - DOKUMENTIERT']});
  document.getElementById('teamName').value=''; save(); zeigeTeams();
}

function zeigeTeams(){
  let div=document.getElementById('teamListe'); let html='';
  for(let i=0;i<teams.length;i++){
    let t=teams[i]; let isMember=t.members.includes(meinName); let voll=t.members.length>=7;
    html+='<div class="team '+(voll?'voll':'')+'" onclick="oeffneTeam('+i+')"><b>'+t.name+'</b> ('+t.members.length+'/7) '+(isMember?'✅ DU DRIN':'')+'<br><span style="font-size:13px">Mitglieder: '+t.members.join(', ')+'</span><br><span style="font-size:11px;color:#8f8">Tippen zum Lesen - Alle dürfen lesen, nur Mitglieder schreiben</span></div>';
  }
  div.innerHTML=html;
  document.getElementById('myTeamsInfo').innerHTML='Du: '+(meinName||'nicht angemeldet')+' | Teams: '+countMyTeams()+'/3 | Regel: 7 pro Team, max 3 pro Person';
}

function oeffneTeam(idx){
  let t=teams[idx]; let isMember=t.members.includes(meinName); let myCount=countMyTeams();
  let html='<div class="detail"><h2 style="margin:0">TEAM: '+t.name+'</h2>';
  html+='<div class="info"><b>1. TEAM DATEN (JEDER DARF LESEN):</b><br>Name: '+t.name+'<br>Mitglieder '+t.members.length+'/7: '+t.members.join(', ')+'<br>Deine Teams: '+myCount+'/3<br>Erstellt: Jahr 0</div>';
  html+='<h3>📜 CHAT DOKUMENTATION ('+t.msgs.length+') - JEDER KANN LESEN</h3>';
  for(let j=0;j<t.msgs.length;j++){ let me = t.msgs[j].startsWith(meinName+':'); html+='<div class="msg '+(me?'me':'')+'">'+t.msgs[j]+'</div>'; }
  
  html+='<div class="info"><b>2. CHAT SCHREIBEN:</b></div>';
  if(meinName && isMember){
    html+='<textarea id="chatInput" placeholder="Als '+meinName+' schreiben - wird dokumentiert..."></textarea><button onclick="sendeChat('+idx+')">Als '+meinName+' senden</button>';
  }else if(meinName && !isMember){
    if(t.members.length>=7){ html+='<p style="color:#f88">Team voll 7/7 - kein Beitritt möglich</p>'; }
    else if(myCount>=3){ html+='<p style="color:#f88">Du bist schon in 3 Teams! Erst ein Team verlassen!</p>'; }
    else{ html+='<button onclick="beitreten('+idx+')" style="background:#0ff;color:#000">Team beitreten als '+meinName+' ('+myCount+'/3)</button>'; }
    html+='<p
