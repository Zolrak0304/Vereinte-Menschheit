<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS V1.9.5 - FIX</title>
<style>
body{background:#000;color:#0f0;font-family:monospace;margin:0;padding:12px}
.box{border:3px solid #0f0;padding:12px;margin:12px 0;background:#000}
input,textarea{width:100%;padding:16px;margin:8px 0;background:#111;border:2px solid #0f0;color:#0f0;font-size:18px;box-sizing:border-box}
button{width:100%;padding:16px;margin:6px 0;background:#0a0;color:#fff;font-weight:bold;font-size:18px;border:0}
#status{font-size:19px;text-align:center;padding:12px;border:3px solid #0ff}
.team{border:2px dashed #0f0;padding:12px;margin:8px 0}
.detail{border:3px solid #ff0;padding:12px;background:#1a1a00;color:#ff0;position:fixed;top:10px;left:10px;right:10px;bottom:10px;overflow-y:auto;z-index:99}
.msg{border-left:4px solid #0f0;padding:6px;margin:6px 0;background:#000;color:#0f0}
</style>
</head>
<body>

<div class="box" style="border-color:#0ff">
<h2 style="text-align:center">🔐 ANMELDUNG V1.9.5 - FIXED</h2>
<div id="status" style="color:#f88;background:#200">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name z.B. Zolrak">
<input id="pass1" type="password" placeholder="Passwort erstellen">
<input id="pass2" type="password" placeholder="Passwort bestätigen">
<button onclick="registerLogin()" style="background:#0f0;color:#000">ANMELDEN / REGISTRIEREN</button>
<button onclick="direktZolrak()" style="background:#0ff;color:#000">DIREKT ALS ZOLRAK</button>
<button onclick="logout()" style="background:#333">ABMELDEN</button>
</div>

<div class="box">
<h1 style="text-align:center;margin:0">VEREINTE MENSCHHEIT V1.9.5</h1>
<p style="text-align:center;font-size:11px" id="myTeamsInfo"></p>
</div>

<div class="box">
<h2 style="text-align:center">TEAMS (1-7 pro Team)</h2>
<input id="teamName" placeholder="Team Name z.B. Nahrung">
<button onclick="createTeam()">Team gründen</button>
<div id="teamListe"></div>
</div>

<div id="teamDetail"></div>

<script>
// ALTE VERSIONEN LÖSCHEN - DAS WAR DER BUG
localStorage.removeItem('nexus_users'); localStorage.removeItem('nexus_users_v2'); localStorage.removeItem('nexus_users_v3'); localStorage.removeItem('nexus_meinName_v2'); localStorage.removeItem('nexus_meinName_v3'); localStorage.removeItem('nexus_teams'); localStorage.removeItem('nexus_teams_v2'); localStorage.removeItem('nexus_teams_v3');

var users = JSON.parse(localStorage.getItem('nexus_users_v5')||'{}');
var teams = JSON.parse(localStorage.getItem('nexus_teams_v5')||'[{"name":"Nahrung","members":["Zolrak"],"msgs":["Zolrak: Jahr 0 - Nahrung sichern!"]}]');
var meinName = localStorage.getItem('nexus_meinName_v5')||'';

function save(){ localStorage.setItem('nexus_users_v5', JSON.stringify(users)); localStorage.setItem('nexus_teams_v5', JSON.stringify(teams)); if(meinName) localStorage.setItem('nexus_meinName_v5', meinName); }

function countMyTeams(){ var c=0; for(var i=0;i<teams.length;i++){ if(teams[i].members.indexOf(meinName)!==-1) c++; } return c; }

function registerLogin(){
  var n = document.getElementById('name').value.trim();
  var p1 = document.getElementById('pass1').value.trim();
  var p2 = document.getElementById('pass2').value.trim();
  alert('Klick erkannt: '+n); // DEBUG damit du siehst dass es geht
  if(n.length<2){ alert('Name zu kurz'); return; }
  if(p1.length<3){ alert('Passwort mind 3 Zeichen'); return; }
  if(users[n]){
    if(users[n]!==p1){ alert('FALSCHES PASSWORT für '+n); return; }
    meinName=n; document.getElementById('status').innerHTML='✓ ANGEMELDET: '+n+' | Teams '+countMyTeams()+'/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams();
  }else{
    if(p1!==p2){ alert('Passwörter nicht gleich!'); return; }
    users[n]=p1; meinName=n; document.getElementById('status').innerHTML='✓ NEU: '+n+' | Teams 0/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams(); alert('ERSTELLT! '+n);
  }
}
function direktZolrak(){ if(!users['Zolrak']){ alert('Zolrak nicht vorhanden - erst registrieren'); return; } meinName='Zolrak'; document.getElementById('status').innerHTML='✓ DIREKT ALS ZOLRAK | Teams '+countMyTeams()+'/3'; document.getElementById('status').style.color='#0f0'; document.getElementById('status').style.background='#020'; save(); zeigeTeams(); }
function logout(){ localStorage.removeItem('nexus_meinName_v5'); meinName=''; document.getElementById('status').innerHTML='NICHT ANGEMELDET'; document.getElementById('status').style.color='#f88'; document.getElementById('status').style.background='#200'; zeigeTeams(); }
function createTeam(){
  if(!meinName){ alert('Erst anmelden'); return; }
  var t=document.getElementById('teamName').value.trim();
  if(t.length<3){ alert('Mind 3 Zeichen'); return; }
  for(var i=0;i<teams.length;i++){ if(teams[i].name.toLowerCase()===t.toLowerCase()){ alert('Team existiert'); return; } }
  if(countMyTeams()>=3){ alert('Du bist schon in 3 Teams!'); return; }
  teams.push({name:t, members:[meinName], msgs:[meinName+': Team '+t+' gegründet']}); document.getElementById('teamName').value=''; save(); zeigeTeams();
}
function zeigeTeams(){
  var div=document.getElementById('teamListe'); var html='';
  for(var i=0;i<teams.length;i++){ var t=teams[i]; var isM=t.members.indexOf(meinName)!==-1; html+='<div class="team" onclick="oeffneTeam('+i+')"><b>'+t.name+'</b> ('+t.members.length+'/7) '+(isM?'✅':'')+'<br><small>'+t.members.join(', ')+'</small></div>'; }
  div.innerHTML=html; document.getElementById('myTeamsInfo').innerHTML='Du: '+(meinName||'nicht angemeldet')+' | Teams: '+countMyTeams()+'/3';
}
function oeffneTeam(idx){
  var t=teams[idx]; var isM=t.members.indexOf(meinName)!==-1; var html='<div class="detail"><h2>TEAM: '+t.name+'</h2><p>Mitglieder '+t.members.length+'/7: '+t.members.join(', ')+'</p><h3>CHAT - JEDER DARF LESEN</h3>';
  for(var j=0;j<t.msgs.length;j++){ html+='<div class="msg">'+t.msgs[j]+'</div>'; }
  if(meinName && isM){ html+='<textarea id="chatInput" placeholder="Nachricht..."></textarea><button onclick="sendeChat('+idx+')">Senden als '+meinName+'</button>'; }
  else if(meinName && !isM){ if(t.members.length>=7){ html+='<p>Voll!</p>'; }else if(countMyTeams()>=3){ html+='<p>Max 3 Teams erreicht!</p>'; }else{ html+='<button onclick="beitreten('+idx+')" style="background:#0ff;color:#000">Beitreten als '+meinName+'</button>'; } }
  html+='<button onclick="document.getElementById(\'teamDetail\').innerHTML=\'\'" style="background:#333;margin-top:10px">Schließen</button></div>'; document.getElementById('teamDetail').innerHTML=html;
}
function beitreten(idx){ if(countMyTeams()>=3){ alert('Max 3 Teams'); return; } var t=teams[idx]; if(t.members.length>=7){ alert('Voll'); return; } t.members.push(meinName); t.msgs.push(meinName+' be
