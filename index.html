<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VEREINTE MENSCHHEIT - NEXUS V2 DEUTSCH</title>
<style>
*{box-sizing:border-box}
body{background:#050505;color:#e8ffe8;font-family:system-ui,Arial,sans-serif;margin:0;padding:12px}
.card{border:1px solid #1f3d1f;background:#0a120a;border-radius:14px;padding:14px;margin:12px 0}
h1,h2{margin:0 0 10px;text-align:center}
h1{font-size:24px;color:#4dff6a;letter-spacing:1px}
h2{font-size:18px;color:#7dffef}
input,select,textarea{width:100%;padding:13px;margin:6px 0;background:#111;border:1px solid #2f6b2f;border-radius:10px;color:#fff;font-size:15px}
button{width:100%;padding:13px;margin:6px 0;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer}
.btn-green{background:#22c55e;color:#000}
.btn-cyan{background:#22d3ee;color:#000}
.btn-dark{background:#222;color:#fff}
.btn-red{background:#991b1b;color:#fff}
.rule{border-left:3px solid #22d3ee;padding:8px 10px;margin:8px 0;background:#071515;font-size:13px;line-height:1.4}
.rule b{color:#22d3ee}
.team{border:1px solid #2f6b2f;border-radius:10px;padding:10px;margin:8px 0;background:#0d1a0d}
.pill{display:inline-block;background:#132613;border:1px solid #2f6b2f;border-radius:20px;padding:4px 8px;font-size:11px;margin:2px}
.log{border:1px solid #4a3f00;background:#151200;color:#ffe66d;padding:6px;margin:4px 0;font-size:11px;border-radius:8px}
.small{font-size:11px;color:#888;text-align:center}
.hidden{display:none}
</style>
</head>
<body>

<div class="card" id="loginCard">
<h1>VEREINTE MENSCHHEIT</h1>
<p style="text-align:center;color:#4dff6a;margin:0">NEXUS V2 DEUTSCH - JAHR 0</p>
<div id="status" style="text-align:center;padding:10px;margin:10px 0;border-radius:10px;background:#2a0000;color:#ff8a8a;font-weight:800">NICHT ANGEMELDET</div>
<input id="name" placeholder="Name">
<input id="pass1" type="password" placeholder="Passwort">
<input id="pass2" type="password" placeholder="Neu: Passwort bestätigen">
<h2>🧬 3 FRAGEN JA / NEIN</h2>
<select id="q1"><option value="">1. BIST DU MENSCH?</option><option value="JA">JA - Mensch (letztes Wort)</option><option value="NEIN">NEIN - KI (Logik)</option></select>
<select id="q2"><option value="">2. PACKST DU AN?</option><option value="JA">JA - Macher (Bauen/Tun | Schwäche Ungeduld)</option><option value="NEIN">NEIN - Denker (Plan/Analyse | Schwäche Zerdenken)</option></select>
<select id="q3"><option value="">3. KLARE AUFGABEN?</option><option value="JA">JA - Plan (braucht Befehl)</option><option value="NEIN">NEIN - Frei (kreativ)</option></select>
<button class="btn-green" onclick="doLogin()">ANMELDEN / REGISTRIEREN</button>
<button class="btn-dark" onclick="doLogout()">ABMELDEN</button>
<button class="btn-red" onclick="doDelete()">⚠️ ALLES LÖSCHEN (mit Auto-Backup)</button>
<p class="small">Schutz: Eingabe gesäubert | 3x falsch = 30s Sperre | Auto-Backup bei jeder Aktion</p>
</div>

<div id="mainApp" class="hidden">

<div class="card">
